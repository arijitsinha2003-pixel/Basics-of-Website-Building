<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Selectors</title>
    <style>
        /* Element Selector */
        /* div {
            /* background-color: red;
            color: yellow; 
            ]*/
        

        /* Class selector */
        .red {
            background-color: red;
        }

        .yellow {
            background-color: yellow;
        }

        /* ID selector */
        #green {
            background-color: green;
        }

        /* Child selector */
        div>p {
            color: blue;
            background-color: brown;
        }

        /* Desendent selector */
        div p {
            color: blue;
            background-color: brown;
        }

        /* Universal Selector */
        * {
            margin: 0;
            padding: 0;
        }

        /* Pseudo Selector */
        a:visited{
            color: red;
        }

    </style>
</head>

<body>
    <div class="red">
        I am a div
        <p>I am a para inside div</p>
    </div>
    <div Id="green">
        I am another div
    </div>
    <a target="_blank" href="https://www.google.com">Open Google</a>
</body>

</html>
